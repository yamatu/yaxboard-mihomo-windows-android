xboard:
  provider: mihomo

  bootstrap:
    # Optional: remote bootstrap yaml URL. Client will try this first.
    remote_url: https://your-pan.example.com/xboard.config.yaml
    timeout_seconds: 15
    cache_remote_to_disk: true
    headers:
      Authorization: Bearer your-token

  remote_config:
    sources:
      - name: redirect
        url: https://your-pan.example.com/config.json

  app:
    title: XBoard
    website: example.com

  subscription:
    prefer_encrypt: false
    decrypt_key: your_secret_decrypt_key_here

  network:
    force_direct_domains:
      - your-pan.example.com
    enable_doh_resolver: true
    doh_url: https://dns.alidns.com/resolve

  security:
    obfuscation_prefix: ""
    user_agents:
      api_encrypted: "Mozilla/5.0 (compatible; YOUR_ENCRYPTED_STRING_HERE)"
      domain_racing_test: "FlClash/1.0 (Domain Racing Test)"
